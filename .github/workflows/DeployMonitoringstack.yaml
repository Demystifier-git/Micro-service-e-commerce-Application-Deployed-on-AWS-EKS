name: Deploy Monitoring Folder via SSM

on:
  push:
    branches:
      - main   # trigger on every push to main
      
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for OIDC
      contents: read

    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::<ACCOUNT_ID>:role/<GitHubOIDCRole>
          aws-region: us-east-1   # change to your region

      - name: Deploy monitoring folder via SSM
        run: |
          aws ssm send-command \
            --targets "Key=instanceIds,Values=${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Clone only monitoring folder" \
            --parameters 'commands=["mkdir -p /home/ec2-user/repo && cd /home/ec2-user/repo && if [ ! -d .git ]; then git init && git remote add origin <your-repo-url> && git config core.sparseCheckout true && echo monitoring/* > .git/info/sparse-checkout; fi && git pull origin main"]'

