name: Deploy Monitoring Repo via SSM

on:
  push:
    paths:
      - 'monitoring/**'   # only trigger when monitoring folder changes
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      id-token: write   # required for OIDC
      contents: read

    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.TERRAFORM_AWS_ROLE_ARN }}
          aws-region: us-east-1   # change to your region

      - name: Update monitoring folder on EC2
        run: |
          aws ssm send-command \
            --targets "Key=instanceIds,Values=${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Update monitoring folder" \
            --parameters 'commands=["cd /home/ec2-user/repo && git pull origin main"]'
