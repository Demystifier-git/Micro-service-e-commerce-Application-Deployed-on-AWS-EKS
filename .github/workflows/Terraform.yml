name: Terraform Production Deployment

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:

  # TERRAFORM PLAN + STATIC ANALYSIS
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    environment:
      name: production
    defaults:
      run:
        working-directory: terraform
    env:
      TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_db_name: ${{ secrets.DB_NAME }}
      TF_VAR_secret_values: ${{ secrets.SECRET_VALUES }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.TERRAFORM_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3

      # Terraform checks
      - name: Terraform Format
        continue-on-error: true
        run: terraform fmt -check -recursive > fmt.log 2>&1 || true

      - name: Terraform Init
        continue-on-error: true
        run: terraform init -reconfigure > init.log 2>&1 || true

      - name: Terraform Validate
        continue-on-error: true
        run: terraform validate > validate.log 2>&1 || true

      # TFLint
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Run TFLint
        continue-on-error: true
        run: |
          tflint --init || true
          tflint > tflint.log 2>&1 || true

      # tfsec
      - name: tfsec
        continue-on-error: true
        run: tfsec . > tfsec.log 2>&1 || true

      # Checkov
      - name: Checkov
        continue-on-error: true
        run: checkov -d . > checkov.log 2>&1 || true

      # Trivy
      - name: Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: './terraform'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      # Terraform Plan
      - name: Terraform Plan
        run: terraform plan -input=false -var-file=production.tfvars -out=tfplan

      # Upload Plan
      - uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: terraform/tfplan

      # Upload Scan Logs
      - name: Upload Scan Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-logs
          path: |
            terraform/fmt.log
            terraform/init.log
            terraform/validate.log
            terraform/tflint.log
            terraform/tfsec.log
            terraform/checkov.log

      # Run AI Review if any scan failed
      - name: Setup Python
        if: failure()
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install AI Dependencies
        if: failure()
        run: |
          python -m pip install --upgrade pip
          pip install -r ../requirements.txt

      - name: AI DevOps Engineer
        if: failure()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python ../.github/scripts/ai_devops_engineer.py terraform/fmt.log terraform/init.log terraform/validate.log terraform/tflint.log terraform/tfsec.log terraform/checkov.log ai_report.md

      - name: Publish AI Report
        if: failure()
        run: cat ai_report.md >> $GITHUB_STEP_SUMMARY

  # APPLY
  apply:
    name: Terraform Apply
    needs: plan
    runs-on: ubuntu-latest
    environment:
      name: production
    defaults:
      run:
        working-directory: terraform
    env:
      TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_db_name: ${{ secrets.DB_NAME }}
      TF_VAR_secret_values: ${{ secrets.SECRET_VALUES }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.TERRAFORM_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -reconfigure

      - uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: terraform

      - name: Terraform Apply
        id: terraform_apply
        continue-on-error: true
        run: terraform apply -input=false tfplan 2>&1 | tee terraform.log

      - name: Upload Terraform Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-logs
          path: terraform/terraform.log

      - name: Setup Python
        if: failure()
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install AI Dependencies
        if: failure()
        run: |
          python -m pip install --upgrade pip
          pip install -r ../requirements.txt

      - name: AI DevOps Engineer
        if: failure()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python ../.github/scripts/ai_devops_engineer.py terraform/terraform.log ai_report.md

      - name: Publish AI Report
        if: failure()
        run: cat ai_report.md >> $GITHUB_STEP_SUMMARY

      - name: Exit
        if: steps.terraform_apply.outcome == 'failure'
        run: exit 1


