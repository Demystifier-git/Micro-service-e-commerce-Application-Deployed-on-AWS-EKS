name: Terraform Production Deployment

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:

################################################################################
# STATIC ANALYSIS
################################################################################

  static-analysis:

    runs-on: ubuntu-latest

    environment: production

    defaults:
      run:
        working-directory: terraform

    env:
      TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_db_name: ${{ secrets.DB_NAME }}
      TF_VAR_secret_values: ${{ secrets.SECRET_VALUES }}

    steps:

      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.TERRAFORM_AWS_ROLE_ARN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3

      - uses: terraform-linters/setup-tflint@v4

      - name: Terraform fmt
        continue-on-error: true
        run: terraform fmt -check -recursive > fmt.log 2>&1

      - name: Terraform Init
        run: terraform init -reconfigure

      - name: Terraform Validate
        continue-on-error: true
        run: terraform validate > validate.log 2>&1

      - name: TFLint
        continue-on-error: true
        run: |
          tflint --init
          tflint > tflint.log 2>&1

      - name: tfsec
        continue-on-error: true
        run: tfsec . > tfsec.log 2>&1

      - name: Checkov
        continue-on-error: true
        run: checkov -d . > checkov.log 2>&1

      - name: Trivy
        continue-on-error: true
        run: trivy config . > trivy.log 2>&1

      - uses: actions/upload-artifact@v4
        with:
          name: security-logs
          path: |
            terraform/fmt.log
            terraform/validate.log
            terraform/tflint.log
            terraform/tfsec.log
            terraform/checkov.log
            terraform/trivy.log

################################################################################
# AI REVIEW
################################################################################

  ai-review:

    needs: static-analysis

    if: always()

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: security-logs

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: |
          pip install -r requirements.txt

      - name: Gemini Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python .github/scripts/ai_devops_engineer.py

      - name: Publish AI Report
        if: always()
        run: |
          cat ai_report.md >> $GITHUB_STEP_SUMMARY

################################################################################
# PLAN
################################################################################

  plan:

    needs: static-analysis

    if: needs.static-analysis.result == 'success'

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:

      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.TERRAFORM_AWS_ROLE_ARN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3

      - run: terraform init -reconfigure

      - run: terraform plan -out=tfplan -var-file=production.tfvars

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: terraform/tfplan

################################################################################
# APPLY
################################################################################

  apply:

    needs: plan

    runs-on: ubuntu-latest

    environment: production

    defaults:
      run:
        working-directory: terraform

    steps:

      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: terraform

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.TERRAFORM_AWS_ROLE_ARN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3

      - run: terraform init -reconfigure

      - run: terraform apply -input=false tfplan

        