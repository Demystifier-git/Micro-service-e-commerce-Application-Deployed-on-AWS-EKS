name: Terraform Production Deployment

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:

  ################################################################################
  # TEST RUNNER CONNECTIVITY
  ################################################################################
  test-runner:
    name: Test Runner Connectivity
    runs-on: [self-hosted, ubuntu]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Print Runner Info
        run: |
          echo "✅ Hello from self-hosted runner!"
          echo "Hostname: $(hostname)"
          echo "Date: $(date)"
          echo "Working directory: $(pwd)"

  ################################################################################
  # TERRAFORM PLAN
  ################################################################################
  plan:
    name: Terraform Plan
    needs: test-runner
    runs-on: [self-hosted, ubuntu]
    environment:
      name: production
    defaults:
      run:
        working-directory: terraform
    env:
      TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_db_name: ${{ secrets.DB_NAME }}
      TF_VAR_secret_values: ${{ secrets.SECRET_VALUES }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.TERRAFORM_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format
        run: terraform fmt -check -recursive | tee fmt.log

      - name: Terraform Init
        run: terraform init -reconfigure | tee init.log

      - name: Terraform Validate
        run: terraform validate | tee validate.log

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Run TFLint
        run: |
          tflint --init
          tflint | tee tflint.log

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform

      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: terraform

      - name: Upload Security Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-logs
          path: |
            terraform/fmt.log
            terraform/init.log
            terraform/validate.log
            terraform/tflint.log

      - name: Terraform Plan
        run: |
          terraform plan \
            -input=false \
            -var-file=production.tfvars \
            -out=tfplan | tee plan.log

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: terraform/tfplan

  ################################################################################
  # TERRAFORM APPLY
  ################################################################################
  apply:
    name: Terraform Apply
    needs: plan
    runs-on: [self-hosted, ubuntu]
    environment:
      name: production
    defaults:
      run:
        working-directory: terraform
    env:
      TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_db_name: ${{ secrets.DB_NAME }}
      TF_VAR_secret_values: ${{ secrets.SECRET_VALUES }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.TERRAFORM_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -reconfigure | tee init.log

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: terraform

      - name: Terraform Apply
        run: |
          terraform apply -input=false tfplan | tee apply.log

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-logs
          path: terraform/*.log
