name: Terraform Production Deployment

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:

  ################################################################################
  # TERRAFORM PLAN
  ################################################################################
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    environment:
      name: production
    defaults:
      run:
        working-directory: terraform
    env:
      TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_db_name: ${{ secrets.DB_NAME }}
      TF_VAR_secret_values: ${{ secrets.SECRET_VALUES }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.TERRAFORM_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format
        continue-on-error: true
        run: terraform fmt -check -recursive > fmt.log 2>&1

      - name: Terraform Init
        continue-on-error: true
        run: terraform init -reconfigure > init.log 2>&1

      - name: Terraform Validate
        continue-on-error: true
        run: terraform validate > validate.log 2>&1

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Run TFLint
        continue-on-error: true
        run: |
          tflint --init
          tflint > tflint.log 2>&1

      - name: Run tfsec
        continue-on-error: true
        uses: aquasecurity/tfsec-action@v1.0.3

      - name: Run Checkov
        continue-on-error: true
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform

      - name: Run Trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: terraform

      - name: Upload Security Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-logs
          path: |
            terraform/fmt.log
            terraform/init.log
            terraform/validate.log
            terraform/tflint.log
            terraform/tfsec.log
            terraform/checkov.log
            terraform/trivy.log

      - name: Terraform Plan
        run: |
          terraform plan \
            -input=false \
            -var-file=production.tfvars \
            -out=tfplan

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: terraform/tfplan

  ################################################################################
  # TERRAFORM APPLY
  ################################################################################
  apply:
    name: Terraform Apply
    needs: plan
    runs-on: ubuntu-latest
    environment:
      name: production
    defaults:
      run:
        working-directory: terraform
    env:
      TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_db_name: ${{ secrets.DB_NAME }}
      TF_VAR_secret_values: ${{ secrets.SECRET_VALUES }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.TERRAFORM_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -reconfigure

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: terraform

      - name: Terraform Apply
        id: terraform_apply
        continue-on-error: true
        run: |
          set +e
          terraform apply -input=false tfplan 2>&1 | tee terraform.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          exit $EXIT_CODE

      - name: Upload Terraform Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-log
          path: terraform/terraform.log

      - name: Download Security Logs
        if: steps.terraform_apply.outputs.exit_code != '0'
        uses: actions/download-artifact@v4
        with:
          name: security-logs
          path: terraform

      - name: Setup Python
        if: steps.terraform_apply.outputs.exit_code != '0'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install AI Dependencies
        if: steps.terraform_apply.outputs.exit_code != '0'
        run: |
          python -m pip install --upgrade pip
          pip install -r .github/requirements.txt

      - name: Run AI DevOps Engineer
        if: steps.terraform_apply.outputs.exit_code != '0'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python .github/scripts/ai_devops_engineer.py

      - name: Publish AI Report
        if: steps.terraform_apply.outputs.exit_code != '0'
        run: |
          cat terraform/ai_report.md >> $GITHUB_STEP_SUMMARY

      - name: Upload AI Report
        if: steps.terraform_apply.outputs.exit_code != '0'
        uses: actions/upload-artifact@v4
        with:
          name: ai-report
          path: terraform/ai_report.md

      - name: Upload All Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-logs
          path: |
            terraform/*.log
            terraform/*.md

      - name: Fail Workflow
        if: steps.terraform_apply.outputs.exit_code != '0'
        run: exit 1
