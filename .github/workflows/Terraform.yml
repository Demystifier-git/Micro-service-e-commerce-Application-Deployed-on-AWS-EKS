name: Terraform Production Deployment

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:

  ################################################################################
  # TERRAFORM PLAN
  ################################################################################
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    environment:
      name: production

    defaults:
      run:
        working-directory: terraform

    env:
      TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_db_name: ${{ secrets.DB_NAME }}
      TF_VAR_secret_values: ${{ secrets.SECRET_VALUES }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.TERRAFORM_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format
        run: |
          set -o pipefail
          terraform fmt -check -recursive | tee fmt.log

      - name: Terraform Init
        run: |
          set -o pipefail
          terraform init -reconfigure | tee init.log

      - name: Terraform Validate
        run: |
          set -o pipefail
          terraform validate | tee validate.log

      - name: Terraform Plan
        run: |
          set -o pipefail
          terraform plan \
            -input=false \
            -var-file=production.tfvars \
            -out=tfplan | tee plan.log

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: terraform/tfplan

  ################################################################################
  # TERRAFORM APPLY (requires manual approval in GitHub Environments)
  ################################################################################
  apply:
    name: Terraform Apply
    needs: plan
    runs-on: ubuntu-latest
    environment:
      name: production

    defaults:
      run:
        working-directory: terraform

    env:
      TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_db_name: ${{ secrets.DB_NAME }}
      TF_VAR_secret_values: ${{ secrets.SECRET_VALUES }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.TERRAFORM_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: |
          set -o pipefail
          terraform init -reconfigure | tee init.log

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: terraform

      - name: Terraform Apply
        run: |
          set -o pipefail
          terraform apply -input=false tfplan | tee apply.log

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-logs
          path: terraform/*.log




