name: Bootstrap Terraform Backend

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to bootstrap (dev/staging/prod)"
        required: true
        default: "dev"

permissions:
  id-token: write   # required for OIDC
  contents: read    # required to checkout repo

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.TERRAFORM_AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: bootstrap
        run: terraform init

      - name: Terraform Apply
        working-directory: bootstrap
        run: terraform apply -auto-approve -var="env=${{ github.event.inputs.environment }}" -var="account_id=${{ secrets.AWS_ACCOUNT_ID }}"
