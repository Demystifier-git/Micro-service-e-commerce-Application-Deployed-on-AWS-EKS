apiVersion: apps/v1
kind: Deployment
metadata:
  name: dispatch
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dispatch
  template:
    metadata:
      labels:
        app: dispatch
    spec:
      containers:
        - name: dispatch
          image: <ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/dispatch:latest

          ports:
            - containerPort: 8080

          env:
            - name: AMQP_HOST
              value: rabbitmq

            - name: AMQP_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-db
                  key: username

            - name: AMQP_PASS
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-db
                  key: password

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: dispatch
spec:
  selector:
    app: dispatch
  ports:
    - port: 8080
      targetPort: 8080