apiVersion: apps/v1
kind: Deployment
metadata:
  name: user
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user

  template:
    metadata:
      labels:
        app: user

    spec:
      containers:
        - name: user
          image: <ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/user:latest

          ports:
            - containerPort: 8080

          env:
            - name: MONGODB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: user-mongodb
                  key: username

            - name: MONGODB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: user-mongodb
                  key: password

            - name: MONGODB_HOST
              valueFrom:
                secretKeyRef:
                  name: user-mongodb
                  key: host

            - name: REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: user-redis
                  key: host

            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: user-redis
                  key: password

            - name: REDIS_PORT
              valueFrom:
                secretKeyRef:
                  name: user-redis
                  key: port

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: user

spec:
  selector:
    app: user

  ports:
    - port: 8080
      targetPort: 8080