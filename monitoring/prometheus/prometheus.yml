global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Node Exporter metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets:
        - '10.0.1.11:9100'
        - '10.0.1.12:9100'
        - '10.0.1.13:9100'
    # replace with your node private IPs

  # Application metrics via OTEL Collector
  - job_name: 'otel-collector'
    static_configs:
      - targets:
        - '10.0.2.50:8889'
    # replace with the OTEL Collector’s private IP
